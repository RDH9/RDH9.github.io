<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — RDH</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <section class="hero" style="padding-bottom: 1.5rem;">
    <div class="container">
      <p class="eyebrow">Contact</p>
      <h1>Get in touch</h1>
      <p class="subtitle">Feel free to reach out about opportunities, projects, or just to connect.</p>
    </div>
  </section>

  <section>
    <div class="container">
      <ul class="contact-list">
        <li><span class="label">Email</span> <a href="mailto:youremail@example.com">youremail@example.com</a></li>
        <li><span class="label">GitHub</span> <a href="https://github.com/yourusername" target="_blank" rel="noopener">github.com/yourusername</a></li>
        <li><span class="label">LinkedIn</span> <a href="https://linkedin.com/in/yourusername" target="_blank" rel="noopener">linkedin.com/in/yourusername</a></li>
      </ul>
      <p style="color: var(--text-muted); font-size: 0.9rem;">
        Replace the placeholders above with your real contact links before publishing.
      </p>
    </div>
  </section>

  <script src="js/layout.js"></script>
</body>
</html>
